name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto si viene en zip
        run: |
          if [ -f "OfflineAI-Android-Project.zip" ]; then
            echo "Se encontro un zip, descomprimiendo..."
            unzip -o OfflineAI-Android-Project.zip -d proyecto
          else
            echo "No hay zip"
          fi
          ls -la proyecto

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug)
        working-directory: proyecto
        run: gradle assembleDebug

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
